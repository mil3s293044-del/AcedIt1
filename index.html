<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      THE TAB MARK, and the one a search engine shows beside the result.

      This pointed at https://base44.com/logo_v2.svg — a third party's logo,
      fetched from a third party's domain, on every page load of an app that
      has been migrating off them for months. Swapping the tag fixed the tab
      and did NOT fix Google, which was still printing Base44's orange mark
      next to acedit.au, because a crawler does not look the same way a
      browser does:

        • It wants a real /favicon.ico as well. An SVG icon is supported, but
          the .ico at the root is the path every crawler has always tried and
          the one that is checked without parsing the page.
        • It wants the icon SQUARE and a multiple of 48px. 48 is the size
          Google actually renders in a result, so the .ico carries 16/32/48
          and the browser picks.
        • And apple-touch-icon cannot be an SVG at all — iOS ignores it, so
          "add to home screen" fell back to a screenshot of the page.

      SAFARI wants two more than the others, which is why the PNG pair and the
      mask are here:

        • PNG favicons at 16 and 32. Safari added SVG support late and its
          tab strip, bookmarks bar and Start Page do not all read the same
          asset — a PNG at the size it is drawing is the one every version of
          it has always taken.
        • rel="mask-icon" for a pinned tab. That file is a MASK: Safari
          discards its colours and fills whatever is opaque with the `color`
          here, so it holds the bare spade path and no white card. Ship the
          card and a pinned tab comes back as a solid square with a
          spade-shaped hole in it.

      Every file here is generated from favicon.svg, so the tab, the pinned
      tab, the home screen and the search result cannot drift into four
      different marks.

      Safari also caches favicons in its own icon database and Google
      re-crawls on its own schedule, so neither updates the moment this
      deploys — days to weeks for Google, and a hard reload or a cleared
      website-data entry for Safari. Nothing in the page can force either.
    -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icon-16.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" sizes="any" />
    <link rel="mask-icon" href="/mask-icon.svg" color="#0D1626" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#58CC02" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>AcedIt</title>
    <!--
      THE THEME, SETTLED BEFORE ANYTHING PAINTS.

      This has to be inline, in the head, ahead of the module bundle. If React
      applied the theme instead, every page load would paint light and then
      snap dark a moment later, on every refresh and every navigation, forever.
      That flash is the difference between an app that has a dark mode and one
      that has a good dark mode, and it cannot be reached from inside the app:
      by the time any component renders, it has already happened.

      The rule below is a hand copy of resolveTheme() in src/lib/theme.js,
      because a script that must run before any bundle parses cannot import
      one. src/lib/theme.test.mjs pulls this script back out and runs it
      against every preference, device setting and hour, comparing each answer
      to the module's — so the copy cannot quietly drift from the original.
    -->
    <script id="theme-boot">
      (function () {
        var pref = "system";
        try {
          var saved = localStorage.getItem("acedit:theme");
          if (saved === "light" || saved === "dark" || saved === "auto" || saved === "system") pref = saved;
        } catch (e) { /* private mode; system it is */ }

        var dark;
        if (pref === "light") dark = false;
        else if (pref === "dark") dark = true;
        else if (pref === "auto") {
          var h = new Date().getHours();
          dark = h >= 19 || h < 6;          // DARK_FROM_HOUR / LIGHT_FROM_HOUR
        } else {
          dark = !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
        }

        var root = document.documentElement;
        if (dark) root.classList.add("dark"); else root.classList.remove("dark");
        // Without this the browser goes on painting scrollbars, form controls
        // and autofill in light colours over a dark page — the detail that
        // makes an otherwise finished dark mode feel unfinished.
        root.style.colorScheme = dark ? "dark" : "light";
        // And the ground, painted inline. The class alone is not enough: the
        // stylesheet that interprets it is a separate request, and the browser
        // paints its own white canvas in the frames before that request lands.
        // Recording the real build frame by frame showed it plainly — one
        // white frame, then the dark page. These two values are the
        // --background token, and src/lib/theme.js keeps them honest.
        root.style.backgroundColor = dark ? "#0A121F" : "#FBF6EF";
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", dark ? "#0E1417" : "#58CC02");
      })();
    </script>
    <!--
      THE BOOT LAYER. Painted from the first byte of HTML, before a line of
      JavaScript parses, which is the only thing that can cover the gap
      between the browser having the document and React having mounted. That
      gap was a white flash followed by a bare spinner for roughly two
      seconds, and no amount of work inside the app can reach it: by the time
      any component renders, the flash has already happened.

      It is deliberately the same navy and the same wordmark the card storm
      opens on, so the handover is invisible. CardStorm removes this the frame
      its own canvas first paints.
    -->
    <style>
      #boot {
        position: fixed;
        inset: 0;
        z-index: 99;
        /* VISIBLE BY DEFAULT, and the script below takes it away when it is
           not wanted. Defaulting to hidden and switching it on left exactly
           the gap this element exists to close: the browser paints the
           document before the inline script runs, so for those frames there
           was nothing on screen. The script sits immediately after the div
           and runs in the same parse tick, before first paint, so the routes
           that should not have a curtain never show one. */
        display: grid;
        place-items: center;
        background: #0D1626;
      }
      #boot span {
        font-family: Nunito, system-ui, sans-serif;
        font-weight: 800;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        font-size: clamp(13px, 2.1vw, 22px);
        color: #7CFF3D;
        text-shadow: 0 0 18px rgba(124, 255, 61, 0.55), 0 0 46px rgba(124, 255, 61, 0.3);
        opacity: 0;
        animation: bootIn 0.7s ease-out 0.15s forwards;
      }
      @keyframes bootIn { to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        #boot { display: none !important; }
      }
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true"><span>The new age of studying</span></div>
    <script>
      // Only the marketing entry gets the curtain, and only the first time in
      // a session. Read before the module bundle runs, so this sees the value
      // flushGate is about to consume rather than the one it just wrote.
      (function () {
        var b = document.getElementById("boot");
        if (!b) return;
        var seen = false;
        try { seen = sessionStorage.getItem("acedit:flush-seen") === "1"; } catch (e) { seen = true; }
        var reduce = window.matchMedia
          && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        if (seen || reduce || window.location.pathname !== "/") b.remove();
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
