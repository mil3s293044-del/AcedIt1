# Render blueprint — one-shot setup for the AcedIt production deploy.
# Used by Render to create the service from a GitHub repo.
#
# After connecting the repo in Render, the service is created automatically.
# Environment variables marked `sync: false` must be set in the Render dashboard
# (they're secrets — not committed).
services:
  - type: web
    name: acedit
    runtime: node
    plan: starter
    region: oregon
    branch: main
    # TESTS GATE THE DEPLOY, and they run BEFORE the build so a failure costs
    # seconds rather than a full bundle. The suite is ~35s, needs no secrets,
    # no network and no `dist` — it is plain node assertion files over the
    # source tree.
    #
    # The one that makes this worth the minute: `serverBoot.test.mjs`. An `@/`
    # alias in a module `server.mjs` imports builds perfectly and then throws
    # ERR_MODULE_NOT_FOUND on boot, so the deploy dies at the health check with
    # a green build behind it. That shipped, twice in a row. A build that runs
    # the tests turns it into a failure that names the file.
    buildCommand: npm install && npm test && npm run build
    startCommand: node server.mjs
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: PORT
        value: "3001"
      - key: VITE_USE_SUPABASE
        value: "true"
      - key: VITE_TIER_BYPASS
        value: "false"
      # Set these in the Render dashboard (secrets — never commit):
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: VITE_STRIPE_PRICE_PREMIUM
        sync: false
      - key: VITE_BASE44_APP_ID
        sync: false
      - key: VITE_BASE44_APP_BASE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
